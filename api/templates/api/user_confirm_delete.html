{% extends 'api/base.html' %}

{% block content %}
<div class="">
    <div class="">
        <h5 class="mb-0">Supprimer l'utilisateur</h5>
    </div>
    <div class="">
        <p>Voulez-vous vraiment supprimer définitivement <strong>{{ user.email }}</strong> ?</p>
        <form method="post">
            {% csrf_token %}
            <div class="">
                <a href="{% url 'user_list' %}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-danger">Supprimer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
