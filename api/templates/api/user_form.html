{% extends 'api/base.html' %}

{% block content %}
<div class="">
    <div class="">
        <h4 class="mb-0">{{ title }}</h4>
    </div>
    <div class="">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="">
                    <label class="" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="">
                <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-success">Enregistrer</button>
            </div>
        </form>
    </div>²
</div>
{% endblock %}
